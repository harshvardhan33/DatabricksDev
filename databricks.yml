# This is a Declarative Automation Bundle definition for medallion_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: medallion_pipeline
  uuid: 48dc5bd4-d153-469e-a70c-7b0d75aaf58d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0c480a10-d442.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-0c480a10-d442.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/harshsinghv@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/harshsinghv@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: harshsinghv@gmail.com
        level: CAN_MANAGE
